# cargo deny check: known vulnerabilities, unmaintained crates, licenses and sources of every
# dependency. CI runs it (`.github/workflows/ci.yml`); locally: `cargo deny check`.

[advisories]
# Vulnerabilities and unsound code always fail unless listed below with why they don't reach
# Glowfly. Unmaintained crates fail too unless listed with why they are still in the tree.
unmaintained = "all"
ignore = [
    # git2 0.20: Remote::list() on a remote with no refs, and Signatures from a BlameHunk of
    # Blame::blame_buffer(). Glowfly calls neither (networking goes through the git CLI, and
    # blame isn't built from buffers). Fixed in git2 0.21; drop these when upgrading.
    { id = "RUSTSEC-2026-0183", reason = "Remote::list() is not called" },
    { id = "RUSTSEC-2026-0184", reason = "Blame::blame_buffer() is not called" },
    # quick-xml 0.30 comes in through zbus-lockstep (Linux accessibility), which only parses
    # the D-Bus interface XML bundled with atspi, never input from outside.
    { id = "RUSTSEC-2026-0194", reason = "only parses bundled D-Bus XML (zbus-lockstep)" },
    { id = "RUSTSEC-2026-0195", reason = "only parses bundled D-Bus XML (zbus-lockstep)" },
    # Unmaintained, with no maintained release of the crates that use them:
    { id = "RUSTSEC-2025-0141", reason = "bincode 1: syntect's packed syntax and theme dumps" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust: syntect's syntax loading (two-face, at build time)" },
    { id = "RUSTSEC-2024-0436", reason = "paste: a proc-macro of accesskit_windows (eframe 0.31)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: ab_glyph, epaint's font rasterizer (egui 0.31)" },
    # Merged into zbus 6; zbus 4 (accesskit_unix, eframe 0.31's Linux accessibility) and zbus 5
    # (rfd, notify-rust), in the versions Glowfly uses, still depend on them.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: zbus 4 and 5 (accesskit_unix, rfd, notify-rust)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: zbus 4 and 5 (accesskit_unix, rfd, notify-rust)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: zbus 4 and 5 (accesskit_unix, rfd, notify-rust)" },
    # block-buffer 0.10 comes in through digest 0.10 (sha1 in zbus 4; sha2 and hmac in
    # keyring's dbus-secret-service), whose users have no release on digest 0.11. The advisory
    # is a cursor kept inside the block, which a panicking compress leaves overwritten: 0.10
    # keeps its cursor in a field of its own, and the SHA compress functions don't panic.
    { id = "GHSA-qwgh-2vcv-g2f7", reason = "block-buffer 0.10 keeps its cursor outside the block (digest 0.10: zbus 4, dbus-secret-service)" },
]
# osv-scanner.toml lists the same advisories with the same reasons, for OpenSSF Scorecard's OSV
# scan, and SECURITY.md's Known advisories table names them; a test keeps the three in step.

[licenses]
# Glowfly is MIT OR Apache-2.0. These are the licenses its dependencies use (all permissive;
# OFL-1.1 and Ubuntu-font-1.0 are epaint's bundled fonts).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
