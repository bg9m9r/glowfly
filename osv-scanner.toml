# The advisories osv-scanner (OpenSSF Scorecard's Vulnerabilities check) is told to skip in
# Cargo.lock: exactly deny.toml's [advisories] ignore list, with the same reasons, and why each
# doesn't reach Glowfly is in the comments there. Change both files together; a test checks they
# match, and that SECURITY.md's Known advisories table names them.
#
# Each entry lapses on its ignoreUntil date, so the list gets looked at again: re-check the
# advisory, then move the date on (about six months) or drop the entry from both files.
# `ignoreUntil` is the field osv-scanner 2.5 (Scorecard's) reads; later osv-scanner versions
# still read it but prefer `effectiveUntil`.

