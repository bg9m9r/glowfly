# Keeps the SHA-pinned actions and the Cargo dependencies current. Updates are grouped into one
# pull request per ecosystem, and their commit messages follow Conventional Commits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
