name: Release

# On every push to main, release-please keeps a "chore(main): release x.y.z" pull request up to
# date, with the version worked out from Conventional Commit messages and a CHANGELOG entry.
# Merging that pull request tags the release; this workflow then builds and attaches the
# binaries. Run it by hand with an existing tag to (re)build that release's downloads.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # With branch protection requiring CI, the release PR needs a token other than
      # GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger the CI workflow.
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Works out which tag to build, and creates its GitHub release when run by hand.
  prepare:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null || { echo "::error::Tag $TAG doesn't exist"; exit 1; }
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Glowfly $TAG" --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # Cross-compiled on the x64 runner with the image's ARM64 build tools.
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Signing secrets (docs/RELEASING.md). Empty when unset: the packaging scripts then skip
      # signing with a notice, and the release still succeeds.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-deps.sh
      # ring builds its Arm assembly with clang for aarch64-pc-windows-msvc.
      - name: Put LLVM on PATH (ring, Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:/Program Files/LLVM/bin'
      - name: Build
        run: cargo build --release --locked -p glowfly --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          pwsh scripts/package-windows.ps1 -Target ${{ matrix.target }} -Tag "$env:TAG"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh ${{ matrix.target }} "$TAG"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked --version 2.12.1
          cargo install cargo-generate-rpm --locked --version 0.21.0
          bash scripts/package-linux.sh ${{ matrix.target }} "$TAG"
      - name: Upload to the release
        shell: bash
        # Regular files only: dist/ also holds the assembled Glowfly.app folder on macOS.
        run: find dist -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/glowfly-signing.pfx" "$RUNNER_TEMP/glowfly-signing.p12"
          if [ "$RUNNER_OS" = macOS ] && [ -f "$RUNNER_TEMP/glowfly-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/glowfly-signing.keychain-db" || true
          fi

  # SHA256SUMS over every file of the release, for `sha256sum -c SHA256SUMS --ignore-missing`
  # and the app's update check.
  checksums:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish SHA256SUMS
        run: |
          mkdir dist
          gh release download "$TAG" --dir dist --pattern 'glowfly-*'
          rm -f dist/*.sha256
          (cd dist && sha256sum -- * | sort -k2 > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release upload "$TAG" dist/SHA256SUMS --clobber

  # The Homebrew cask and the winget manifests for this release, filled in from SHA256SUMS
  # (scripts/fill-manifests.sh) and attached to the release for submitting (docs/RELEASING.md).
  # A pre-release gets none. Its files (glowfly.rb, Glowfly.Glowfly.*.yaml) stay out of the
  # checksums job's 'glowfly-*' pattern.
  manifests:
    needs: [prepare, checksums]
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Fill in and attach the manifests
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/sums"
          bash scripts/fill-manifests.sh "$TAG" "$RUNNER_TEMP/sums/SHA256SUMS" "$RUNNER_TEMP/manifests" "$GH_REPO"
          if [ -d "$RUNNER_TEMP/manifests" ]; then
            find "$RUNNER_TEMP/manifests" -type f -print0 | xargs -0 -r gh release upload "$TAG" --clobber
          fi
