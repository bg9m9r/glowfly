name: Release

# On every push to main, release-please keeps a "chore(main): release x.y.z" pull request up to
# date, with the version worked out from Conventional Commit messages and a CHANGELOG entry.
# Merging that pull request tags the release; this workflow then builds and attaches the
# binaries. Run it by hand with an existing tag to (re)build that release's downloads.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # With branch protection requiring CI, the release PR needs a token other than
      # GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger the CI workflow.
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Works out which tag to build, and creates its GitHub release when run by hand.
  prepare:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null || { echo "::error::Tag $TAG doesn't exist"; exit 1; }
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Trellis $TAG" --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-deps.sh
      - name: Build
        run: cargo build --release --locked -p trellis --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="trellis-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE-MIT LICENSE-APACHE README.md "$name"/
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "$name"/; fi
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/trellis.exe" "$name"/
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/trellis" "$name"/
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
