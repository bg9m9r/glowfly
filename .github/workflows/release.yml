name: Release

# On every push to main, release-please keeps a "chore(main): release x.y.z" pull request up to
# date, with the version worked out from Conventional Commit messages and a CHANGELOG entry.
# Merging that pull request tags the release and creates it as a draft; this workflow then
# builds and attaches the files to the draft and publishes it last, so a published release never
# changes (release immutability, docs/RELEASING.md). Run it by hand with an existing tag to build
# a release for it, or to rebuild the downloads of a draft or of a release that isn't immutable.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.1.0
        required: true

# Read-only by default; each job asks for what it writes. Publishing waits for the owner: the
# prepare job runs in the `release` environment (required reviewer, main and v* tags only), and
# every job that uploads to or edits the release needs it (docs/RELEASING.md).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Flathub builder image the Flatpak bundle is built in. Its tag pins the freedesktop
  # runtime (packaging/flatpak/io.github.bg9m9r.glowfly.yml) and the flatpak-builder generation.
  FLATPAK_IMAGE: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08

jobs:
  release-please:
    name: Release pull request and tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release tag and creates its draft GitHub release
      pull-requests: write # opens and updates the release pull request
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # With branch protection requiring CI, the release PR needs a token other than
      # GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger the CI workflow. The release is
      # a draft with its tag pushed at once (release-please-config.json: draft and
      # force-tag-creation), so the next release pull request finds this release by its tag.
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Works out which tag to build and which release to fill: release-please's draft, a draft from
  # an earlier run, or a new draft when run by hand (scripts/release-draft.sh). The one approval
  # of a release: this job waits for the owner in the `release` environment, and every job below
  # needs it, so nothing is built, uploaded or published before then.
  prepare:
    name: Prepare (approval)
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: release
      # A draft has no page at its tag until it is published; the list shows it to the owner.
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    permissions:
      contents: write # finds or creates the draft release and puts the header on its notes
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release-id: ${{ steps.release.outputs.id }}
      draft: ${{ steps.release.outputs.draft }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # The workflow's own commit, for the scripts and the header: they belong to the release,
      # not to the tag's build, so a re-run for an older tag gets today's.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: release
        name: Find or create the draft release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release-draft.sh "$TAG"
      # Unsigned builds, how to check a download, no warranty and the licences, above the notes
      # (packaging/release-notes-header.md); a re-run replaces it.
      - name: Put the fixed header on the release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release-notes-header.sh "$TAG"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # Cross-compiled on the x64 runner with the image's ARM64 build tools.
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    # No Rust cache: a cache entry written by another run must never reach a release binary.
    permissions:
      contents: write # uploads the packages to the draft release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET_TRIPLE: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Signing secrets (docs/RELEASING.md). Empty when unset: the packaging scripts then skip
      # signing with a notice, and the release still succeeds.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-deps.sh
      # ring builds its Arm assembly with clang for aarch64-pc-windows-msvc.
      - name: Put LLVM on PATH (ring, Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:/Program Files/LLVM/bin'
      - name: Build
        shell: bash
        run: cargo build --release --locked -p glowfly --target "$TARGET_TRIPLE"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          pwsh scripts/package-windows.ps1 -Target "$env:TARGET_TRIPLE" -Tag "$env:TAG"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh "$TARGET_TRIPLE" "$TAG"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked --version 2.12.1
          cargo install cargo-generate-rpm --locked --version 0.21.0
          bash scripts/package-linux.sh "$TARGET_TRIPLE" "$TAG"
      # Every archive and installer holds LICENSE-MIT, LICENSE-APACHE and THIRD-PARTY-NOTICES.md.
      - name: Check the licence files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/package-check-licences.sh dist/*.zip
      - name: Check the licence files (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/package-check-licences.sh dist/Glowfly.app dist/*.dmg dist/*.tar.gz
      - name: Check the licence files (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/package-check-licences.sh dist/*.tar.gz dist/*.deb dist/*.AppImage
      - name: Upload to the release
        shell: bash
        # Regular files only: dist/ also holds the assembled Glowfly.app folder on macOS.
        run: find dist -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/glowfly-signing.pfx" "$RUNNER_TEMP/glowfly-signing.p12"
          if [ "$RUNNER_OS" = macOS ] && [ -f "$RUNNER_TEMP/glowfly-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/glowfly-signing.keychain-db" || true
          fi

  # The Flatpak bundle (scripts/package-flatpak.sh): the crates are vendored on the runner, since
  # the Flatpak build has no network, then the bundle is built in the pinned builder image. The
  # bundle ships git (GPL-2.0), so the exact git source archive it was built from goes up with it.
  # x86_64 only: the builder image runs natively only on x86_64 runners, and an aarch64 build
  # under emulation (the whole workspace and git) would run far past the job's time.
  flatpak:
    name: Build (Flatpak bundle, x86_64)
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    # Ubuntu 24.04 runners restrict the unprivileged user namespaces bubblewrap needs.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write # uploads the bundle and the git source to the draft release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Vendor the crates
        run: bash scripts/package-flatpak.sh vendor
      - name: Build the bundle
        run: docker run --rm --privileged -v "$PWD:/src" -w /src "$FLATPAK_IMAGE" bash scripts/package-flatpak.sh bundle "$TAG"
      - name: Upload to the release
        run: gh release upload "$TAG" dist/*.flatpak dist/*.flatpak.sha256 dist/git-*.tar.xz dist/git-*.tar.xz.sha256 --clobber

  # SHA256SUMS over every file of the release (the git source archive too), for
  # `sha256sum -c SHA256SUMS --ignore-missing` and the app's update check. A release with a
  # .flatpak must have the git source it was built from (scripts/release-check-git-source.sh).
  # Then a SLSA build provenance attestation over those files and SHA256SUMS itself, signed
  # through Sigstore with this workflow's identity and kept by GitHub, for
  # `gh attestation verify <file> --repo <owner>/glowfly`; its bundle goes up as
  # glowfly-<tag>.intoto.jsonl. The bundle stays out of SHA256SUMS: it is made after it, from
  # the digests of the files it lists, and carries its own signature.
  checksums:
    name: Publish SHA256SUMS and the build provenance
    needs: [prepare, build, flatpak]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # reads the draft's files, uploads SHA256SUMS and the provenance bundle
      id-token: write # gets the OIDC token Sigstore signs the provenance with
      attestations: write # stores the provenance attestation in the repository
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}
      # A re-run finds this job's earlier bundle among the 'glowfly-*' files: it isn't hashed.
      - name: Write SHA256SUMS
        run: |
          mkdir dist
          gh release download "$TAG" --dir dist --pattern 'glowfly-*' --pattern 'git-*.tar.xz'
          bash scripts/release-check-git-source.sh dist
          rm -f dist/*.sha256 dist/*.intoto.jsonl
          (cd dist && sha256sum -- * | sort -k2 > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish SHA256SUMS and the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/glowfly-$TAG.intoto.jsonl"
          gh release upload "$TAG" dist/SHA256SUMS "$RUNNER_TEMP/glowfly-$TAG.intoto.jsonl" --clobber

  # The Homebrew cask and the winget manifests for this release, filled in from SHA256SUMS
  # (scripts/fill-manifests.sh) and attached to the release for submitting (docs/RELEASING.md).
  # A pre-release gets none. Its files (glowfly.rb, Glowfly.Glowfly.*.yaml) stay out of the
  # checksums job's 'glowfly-*' pattern.
  manifests:
    name: Attach the Homebrew and winget manifests
    needs: [prepare, checksums]
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # reads the draft's SHA256SUMS and uploads the manifests to it
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Fill in and attach the manifests
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/sums"
          bash scripts/fill-manifests.sh "$TAG" "$RUNNER_TEMP/sums/SHA256SUMS" "$RUNNER_TEMP/manifests" "$GH_REPO"
          if [ -d "$RUNNER_TEMP/manifests" ]; then
            find "$RUNNER_TEMP/manifests" -type f -print0 | xargs -0 -r gh release upload "$TAG" --clobber
          fi

  # Publishes the draft, last and only when every job above succeeded, so a published release
  # already has all its files: with release immutability on, they and the tag are locked from
  # then on. scripts/release-publish.sh first checks that SHA256SUMS, the provenance bundle and
  # every file SHA256SUMS lists are attached, then publishes a vX.Y.Z tag as the latest release
  # and any other tag (v0.3.0-rc.1) as a pre-release that is never the latest. A failed job
  # leaves the draft for "Re-run failed jobs". A release that was already published when the run
  # began (a rebuild) is left as it is.
  publish:
    name: Publish the release
    needs: [prepare, build, flatpak, checksums, manifests]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.draft == 'true'
      && needs.build.result == 'success' && needs.flatpak.result == 'success'
      && needs.checksums.result == 'success' && needs.manifests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # reads the draft's files and publishes it
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The workflow's own commit, like prepare: publishing belongs to the release, not the build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the draft's files and publish it
        run: bash scripts/release-publish.sh "$TAG" "$RELEASE_ID"
