name: CodeQL

# Code scanning for the Rust code and the workflows themselves, with every query of the default
# suite on. It reads the source without building it (build-mode none). The config file
# (.github/codeql/codeql-config.yml) leaves test code out: tests hold made-up tokens and keys
# and log them on purpose, which would otherwise be reported as hard-coded or logged secrets.
# Results go to the repository's Security tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new queries run against code that hasn't changed.
    - cron: '27 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read # reads the workflow run's details for the upload
      contents: read # reads the source
      security-events: write # uploads the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
