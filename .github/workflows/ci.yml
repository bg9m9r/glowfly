name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1

  # Trellis is developed on Windows. These run the same lint and tests on macOS and Linux;
  # only the image comparisons in the view tests are skipped (the approved images are rendered
  # on Windows), and the rest of each view test still runs.
  build:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      TRELLIS_SKIP_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-deps.sh
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  # Known vulnerabilities, unmaintained crates and licenses of every dependency (deny.toml).
  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
