name: CI

# Pushes to main, and pull requests: a branch with a pull request runs once, not once for the push
# and again for the pull request.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run it supersedes; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A read-only token: this workflow only builds and tests.
permissions:
  contents: read

jobs:
  # The Windows check in three parts at once (`scripts/check.ps1 -Part`): glowfly-core's tests,
  # glowfly-flows' tests, and the lint with every other test binary. Each part builds every test
  # binary, as a full check does, so they share one Rust cache with the same features. The job id
  # stays `check`, the id the cache is keyed on.
  #
  # CARGO_PROFILE_DEV_DEBUG=0 leaves out debug info for the workspace crates (dependencies have
  # none anyway), which makes the test build smaller and faster; panics still name their file and
  # line. RUST_TEST_THREADS runs twice as many tests as the runner's 4 vCPUs, since the tests
  # mostly wait on the git processes they start. Both are set on the steps after the cache, not
  # on the job: the cache key includes CARGO_* and RUST_* variables.
  check:
    name: Check (Windows, ${{ matrix.part }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: core
            parts: core
          - part: flows
            parts: flows
          - part: lint and the rest
            parts: lint,rest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Check
        shell: pwsh
        env:
          PARTS: ${{ matrix.parts }}
          CARGO_PROFILE_DEV_DEBUG: "0"
          RUST_TEST_THREADS: "8"
        run: ./scripts/check.ps1 -Part ($env:PARTS -split ',')
      # Folder identity on a case-sensitive folder: `App` and `app` must stay two folders. Making
      # one may need the WSL feature; without it the tests print a note and skip. The test build
      # is the one the check just made.
      - name: Case-sensitive folder tests
        if: matrix.parts == 'lint,rest'
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "glowfly-cs"
          New-Item -ItemType Directory -Force $dir | Out-Null
          fsutil file setCaseSensitiveInfo $dir enable
          if ($LASTEXITCODE -eq 0) {
            $env:GLOWFLY_TEST_CS_DIR = $dir
          } else {
            Write-Host "note: could not turn on case sensitivity for $dir; the case-sensitive checks skip"
          }
          cargo test --workspace case_twins -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # The required status: passes only when every part of the Windows check passed.
  check-windows:
    name: Check (Windows)
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "The Windows parts: $RESULT"
          test "$RESULT" = success

  # Glowfly is developed on Windows. These run the same lint and tests on macOS and Linux;
  # only the image comparisons in the view tests are skipped (the approved images are rendered
  # on Windows), and the rest of each view test still runs.
  build:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        # Twice the runner's vCPUs (4 on Linux, 3 on macOS); see the Windows check.
        include:
          - os: ubuntu-22.04
            threads: "8"
          - os: macos-15
            threads: "6"
    runs-on: ${{ matrix.os }}
    env:
      GLOWFLY_SKIP_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-deps.sh
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          RUST_TEST_THREADS: ${{ matrix.threads }}
        run: cargo test --workspace --locked
      # Folder identity on a case-sensitive APFS volume (the runner's own is case-insensitive):
      # `App` and `app` must stay two folders.
      - name: Case-sensitive volume tests
        if: runner.os == 'macOS'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          hdiutil create -size 200m -fs "Case-sensitive APFS" -volname cs "$RUNNER_TEMP/cs.dmg"
          hdiutil attach "$RUNNER_TEMP/cs.dmg" -mountpoint "$RUNNER_TEMP/cs"
          GLOWFLY_TEST_CS_DIR="$RUNNER_TEMP/cs" cargo test --workspace --locked case_twins -- --nocapture

  # Known vulnerabilities, unmaintained crates and licenses of every dependency (deny.toml).
  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
