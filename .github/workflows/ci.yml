name: CI

on:
  push:
  pull_request:

# A read-only token: this workflow only builds and tests.
permissions:
  contents: read

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1
      # make-perf-repos.ps1 on small local fixtures (docs/PERF_REPOS.md); downloads nothing.
      - name: Large test repository script
        shell: pwsh
        run: ./scripts/make-perf-repos-test.ps1
      # Folder identity on a case-sensitive folder: `App` and `app` must stay two folders. Making
      # one may need the WSL feature; without it the tests print a note and skip.
      - name: Case-sensitive folder tests
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "glowfly-cs"
          New-Item -ItemType Directory -Force $dir | Out-Null
          fsutil file setCaseSensitiveInfo $dir enable
          if ($LASTEXITCODE -eq 0) {
            $env:GLOWFLY_TEST_CS_DIR = $dir
          } else {
            Write-Host "note: could not turn on case sensitivity for $dir; the case-sensitive checks skip"
          }
          cargo test --workspace case_twins -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Glowfly is developed on Windows. This runs the same lint and tests on Linux; only the image
  # comparisons in the view tests are skipped (the approved images are rendered on Windows), and
  # the rest of each view test still runs. No macOS job on pushes and pull requests: GitHub's
  # macOS runners are often unavailable and slow every landing, so the Release workflow is what
  # builds and packages macOS. Keep the matrix: `Test (ubuntu-22.04)` is a required check.
  build:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      GLOWFLY_SKIP_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        run: ./scripts/linux-deps.sh
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Large test repository script
        shell: pwsh
        run: ./scripts/make-perf-repos-test.ps1

  # Known vulnerabilities, unmaintained crates and licenses of every dependency (deny.toml).
  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
