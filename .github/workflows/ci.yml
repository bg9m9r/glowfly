name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1
      # Folder identity on a case-sensitive folder: `App` and `app` must stay two folders. Making
      # one may need the WSL feature; without it the tests print a note and skip.
      - name: Case-sensitive folder tests
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "trellis-cs"
          New-Item -ItemType Directory -Force $dir | Out-Null
          fsutil file setCaseSensitiveInfo $dir enable
          if ($LASTEXITCODE -eq 0) {
            $env:TRELLIS_TEST_CS_DIR = $dir
          } else {
            Write-Host "note: could not turn on case sensitivity for $dir; the case-sensitive checks skip"
          }
          cargo test --workspace case_twins -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Trellis is developed on Windows. These run the same lint and tests on macOS and Linux;
  # only the image comparisons in the view tests are skipped (the approved images are rendered
  # on Windows), and the rest of each view test still runs.
  build:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      TRELLIS_SKIP_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-deps.sh
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # Folder identity on a case-sensitive APFS volume (the runner's own is case-insensitive):
      # `App` and `app` must stay two folders.
      - name: Case-sensitive volume tests
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 200m -fs "Case-sensitive APFS" -volname cs "$RUNNER_TEMP/cs.dmg"
          hdiutil attach "$RUNNER_TEMP/cs.dmg" -mountpoint "$RUNNER_TEMP/cs"
          TRELLIS_TEST_CS_DIR="$RUNNER_TEMP/cs" cargo test --workspace --locked case_twins -- --nocapture

  # Real X11 input on the release build: clicks, typing, a shortcut, a context menu, a drag, a
  # resize, at scale 1 and 1.5 (scripts/smoke-linux.sh). Screenshots and logs on failure.
  smoke:
    name: Real-input smoke (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-release
      - name: Install Linux build dependencies
        run: ./scripts/linux-deps.sh
      - name: Install the X server, window manager and input tools
        run: sudo apt-get install -y --no-install-recommends xvfb openbox xdotool x11-utils imagemagick jq shellcheck dbus libgl1-mesa-dri libglx-mesa0 libegl1
      - name: Lint the smoke scripts
        run: shellcheck -x scripts/smoke-linux.sh scripts/smoke/*.sh
      - name: Build (release)
        run: cargo build --release --locked -p trellis
      - name: Smoke test with real input
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke
        run: dbus-run-session -- bash scripts/smoke-linux.sh target/release/trellis
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14

  # Real input on the Windows runner's desktop: the release build driven with SendInput at zoom
  # 100% and 150% (scripts/smoke-windows.ps1). Screenshots and logs on failure.
  smoke-windows:
    name: Real-input smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-windows-release
      - name: Lint the smoke scripts
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq '1.23.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          }
          Import-Module PSScriptAnalyzer -RequiredVersion 1.23.0
          $files = @('scripts/smoke-windows.ps1') + (Get-ChildItem scripts/smoke/*.ps1).FullName
          $results = @($files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings scripts/smoke/PSScriptAnalyzerSettings.psd1 })
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize -Wrap RuleName, Severity, ScriptName, Line, Message | Out-String -Width 200 | Write-Host
            exit 1
          }
      - name: Dry run
        run: ./scripts/smoke-windows.ps1 -DryRun
      # The runner has no GPU and no OpenGL 2+; eframe's glow renderer runs on Mesa's llvmpipe.
      - name: Software OpenGL (Mesa llvmpipe)
        env:
          MESA_VERSION: 26.2.4
          MESA_SHA256: 351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($hash -ne $env:MESA_SHA256) { throw "Mesa archive SHA256 is $hash, not $env:MESA_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'mesa'
          7z x -y "-o$dir" $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not extract $archive" }
          "SMOKE_MESA_DIR=$dir\x64" >> $env:GITHUB_ENV
      - name: Build (release)
        run: cargo build --release --locked -p trellis
      - name: Smoke test with real input
        env:
          SMOKE_OUT: ${{ runner.temp }}\smoke-windows
        run: ./scripts/smoke-windows.ps1 -Binary target/release/trellis.exe
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: ${{ runner.temp }}\smoke-windows
          if-no-files-found: ignore
          retention-days: 14

  # Known vulnerabilities, unmaintained crates and licenses of every dependency (deny.toml).
  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
