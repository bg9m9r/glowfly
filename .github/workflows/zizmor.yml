name: zizmor

# Lints the workflows themselves with zizmor (https://docs.zizmor.sh): template injection,
# credentials left in checkouts, overly broad token permissions, unpinned or impostor actions,
# cache poisoning of release builds and the like. Fails on any finding of medium severity or
# higher; a deliberate exception is suppressed where it is, with `# zizmor: ignore[<rule>]` and
# the reason.

# Pushes to main, and pull requests (a branch with a pull request runs once, not twice).
on:
  push:
    branches: [main]
  pull_request:

# As in ci.yml: a new push to a pull request cancels its older run, and each push to main gets
# its own group, so every landed commit keeps its own result.
concurrency:
  group: zizmor-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A read-only token: zizmor only reads the workflows (and, for its online audits, the public
# refs of the actions they use).
permissions:
  contents: read

jobs:
  zizmor:
    name: Lint the workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          min-severity: medium
          # Findings fail the job and show as annotations, instead of a SARIF upload to the
          # Security tab (which would need security-events: write and wouldn't fail the job).
          advanced-security: false
          annotations: true
          version: 1.31.1
