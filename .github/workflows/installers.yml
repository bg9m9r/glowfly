name: Installers

# Builds the release packages the way the Release workflow does, then installs, upgrades,
# starts, update-checks and uninstalls them on a clean runner: the MSI on Windows
# (scripts/installer-check-windows.ps1), the .deb on Linux (scripts/installer-check-linux.sh) and
# the .rpm in a Fedora container (scripts/installer-check-rpm.sh). The MSI and .deb checks run
# scripts/update-feed-check.ps1 with the installed program against local update feeds
# (GLOWFLY_UPDATE_FEED); the .rpm check and the AppImage step ask --check-update with an empty
# feed. The "older" package is the same program packaged as v0.0.1. The Flatpak job builds the
# bundle in the Flathub builder image and installs, update-checks and uninstalls it with
# `flatpak --user` (scripts/installer-check-flatpak.sh). Every archive and installer is checked
# for the licence and notice files (scripts/package-check-licences.sh, and the Windows and
# Flatpak checks themselves), the Flatpak for git's licences and source as well; the macOS job
# packages the app and checks the .app, the dmg and the tar.gz.

on:
  push:
    paths-ignore: ['docs/**', 'TODO.md', 'ROADMAP.md']
  pull_request:
    paths-ignore: ['docs/**', 'TODO.md', 'ROADMAP.md']

# A read-only token: this workflow only builds and tests.
permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Flathub builder image, as in the Release workflow.
  FLATPAK_IMAGE: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08

jobs:
  windows:
    name: Installers (Windows MSI)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installers-windows
      - name: Build (release)
        run: cargo build --release --locked -p glowfly --target x86_64-pc-windows-msvc
      - name: Package an old and the current MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $v = ((cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages | Where-Object name -eq glowfly).version
          pwsh scripts/package-windows.ps1 -Target x86_64-pc-windows-msvc -Tag v0.0.1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $old = Join-Path $env:RUNNER_TEMP old
          New-Item -ItemType Directory -Force $old | Out-Null
          Move-Item dist/glowfly-v0.0.1-* $old
          pwsh scripts/package-windows.ps1 -Target x86_64-pc-windows-msvc -Tag "v$v"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "GLOWFLY_VERSION=$v" >> $env:GITHUB_ENV
      - name: Lint the scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $found = foreach ($f in 'scripts/installer-check-windows.ps1', 'scripts/update-feed-check.ps1', 'scripts/package-windows.ps1') {
            Invoke-ScriptAnalyzer -Path $f -Settings scripts/PSScriptAnalyzerSettings.psd1
          }
          $found | Format-Table -AutoSize ScriptName, Line, RuleName, Message | Out-String -Width 200 | Write-Host
          if (@($found).Count -gt 0) { exit 1 }
      - name: Install, upgrade, start, update-check and uninstall
        shell: pwsh
        run: |
          $triple = 'x86_64-pc-windows-msvc'
          pwsh scripts/installer-check-windows.ps1 `
            -Msi "dist/glowfly-v$env:GLOWFLY_VERSION-$triple.msi" `
            -OldMsi "$env:RUNNER_TEMP/old/glowfly-v0.0.1-$triple.msi" `
            -Zip "dist/glowfly-v$env:GLOWFLY_VERSION-$triple.zip" `
            -Version $env:GLOWFLY_VERSION -Out "$env:RUNNER_TEMP/installers"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-windows
          path: ${{ runner.temp }}/installers
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Installers (Linux DEB, RPM, AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installers-linux
      - name: Install Linux build dependencies and the check's tools
        run: |
          ./scripts/linux-deps.sh
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 jq shellcheck desktop-file-utils rpm2cpio cpio
      - name: Build (release)
        run: cargo build --release --locked -p glowfly --target x86_64-unknown-linux-gnu
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb --locked --version 2.12.1
          cargo install cargo-generate-rpm --locked --version 0.21.0
      - name: Package an old and the current .deb, .rpm and AppImage
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name=="glowfly") | .version')"
          bash scripts/package-linux.sh x86_64-unknown-linux-gnu v0.0.1
          mkdir -p "$RUNNER_TEMP/old"
          mv dist/glowfly-v0.0.1-* "$RUNNER_TEMP/old/"
          bash scripts/package-linux.sh x86_64-unknown-linux-gnu "v$version"
          echo "GLOWFLY_VERSION=$version" >> "$GITHUB_ENV"
      - name: Lint the scripts
        run: |
          shellcheck -x scripts/installer-check-linux.sh scripts/installer-check-rpm.sh scripts/installer-lib-linux.sh \
            scripts/package-linux.sh scripts/fill-manifests.sh scripts/package-flatpak.sh scripts/installer-check-flatpak.sh \
            scripts/package-check-licences.sh scripts/release-check-git-source.sh scripts/release-notes-header.sh
      - name: Check the licence files in the tar.gz, .deb, .rpm and AppImage
        run: |
          bash scripts/package-check-licences.sh dist/glowfly-v"$GLOWFLY_VERSION"-x86_64-unknown-linux-gnu.{tar.gz,deb,rpm,AppImage}
      - name: Install, upgrade, start, update-check and purge
        env:
          INSTALLER_OUT: ${{ runner.temp }}/installers
        run: |
          triple=x86_64-unknown-linux-gnu
          bash scripts/installer-check-linux.sh "dist/glowfly-v$GLOWFLY_VERSION-$triple.deb" \
            "$RUNNER_TEMP/old/glowfly-v0.0.1-$triple.deb" "dist/glowfly-v$GLOWFLY_VERSION-$triple.tar.gz" "$GLOWFLY_VERSION"
      # Without FUSE: the runtime extracts the image and still sets APPIMAGE and APPDIR, so the
      # program finds itself an AppImage copy.
      - name: Start the AppImage
        run: |
          image="$PWD/dist/glowfly-v$GLOWFLY_VERSION-x86_64-unknown-linux-gnu.AppImage"
          app="$(mktemp -d)"
          mkdir -p "$app/home" "$app/config" "$app/cache" "$app/data"
          feed="$(mktemp -d)"
          dl="$(mktemp -d)"
          # Fresh HOME and XDG folders, and an empty update feed.
          run() {
            env APPIMAGE_EXTRACT_AND_RUN=1 HOME="$app/home" XDG_CONFIG_HOME="$app/config" XDG_CACHE_HOME="$app/cache" \
              XDG_DATA_HOME="$app/data" GLOWFLY_UPDATE_FEED="$feed" "$image" "$@"
          }
          got="$(run --version)"
          [ "$got" = "glowfly $GLOWFLY_VERSION" ] || { echo "::error::--version printed '$got'"; exit 1; }
          status=0
          out="$(run --check-update "$dl")" || status=$?
          echo "$out"
          [ "$status" -eq 3 ] || { echo "::error::--check-update exited $status, expected 3"; exit 1; }
          grep -qxF 'install appimage' <<<"$out" || { echo "::error::--check-update didn't print 'install appimage'"; exit 1; }
      - name: Install, upgrade, start, update-check and remove the .rpm (Fedora)
        run: |
          mkdir -p "$RUNNER_TEMP/installers-rpm"
          # The check's tools; dnf then pulls git, GTK 3 and the libraries the package requires.
          docker run --rm -e GITHUB_ACTIONS -e GLOWFLY_VERSION -e INSTALLER_OUT=/out \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/old:/old:ro" -v "$RUNNER_TEMP/installers-rpm:/out" fedora:43 bash -c '
              dnf install -y --setopt=install_weak_deps=False rpm xorg-x11-server-Xvfb mesa-dri-drivers mesa-libGL \
                mesa-libEGL jq desktop-file-utils procps-ng findutils > /out/tools.log 2>&1 &&
              bash /src/scripts/installer-check-rpm.sh "/src/dist/glowfly-v$GLOWFLY_VERSION-x86_64-unknown-linux-gnu.rpm" \
                /old/glowfly-v0.0.1-x86_64-unknown-linux-gnu.rpm "$GLOWFLY_VERSION"'
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-linux
          path: |
            ${{ runner.temp }}/installers
            ${{ runner.temp }}/installers-rpm
          if-no-files-found: ignore
          retention-days: 14

  flatpak:
    name: Installers (Flatpak)
    # Ubuntu 24.04 runners restrict the unprivileged user namespaces bubblewrap needs.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install flatpak and the check's tools
        run: sudo apt-get install -y --no-install-recommends flatpak desktop-file-utils shellcheck
      - name: Lint the scripts
        run: shellcheck -x scripts/package-flatpak.sh scripts/installer-check-flatpak.sh scripts/release-check-git-source.sh
      - name: Build the bundle
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name=="glowfly") | .version')"
          echo "GLOWFLY_VERSION=$version" >> "$GITHUB_ENV"
          bash scripts/package-flatpak.sh vendor
          docker run --rm --privileged -v "$PWD:/src" -w /src "$FLATPAK_IMAGE" bash scripts/package-flatpak.sh bundle "v$version"
      # The git source archive the bundle was built from, beside it as the Release workflow
      # attaches it.
      - name: Check the git source is beside the bundle
        run: bash scripts/release-check-git-source.sh dist
      - name: Install, start, update-check and uninstall
        env:
          INSTALLER_OUT: ${{ runner.temp }}/installers-flatpak
        run: |
          bash scripts/installer-check-flatpak.sh "dist/glowfly-v$GLOWFLY_VERSION-x86_64-unknown-linux-gnu.flatpak" "$GLOWFLY_VERSION"
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-flatpak
          path: ${{ runner.temp }}/installers-flatpak
          if-no-files-found: ignore
          retention-days: 14

  # No install check on macOS: the job packages the app the way the Release workflow does
  # (ad-hoc signed) and checks the licence and notice files in the .app, the dmg and the tar.gz.
  macos:
    name: Packages (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installers-macos
      - name: Build (release)
        run: cargo build --release --locked -p glowfly --target aarch64-apple-darwin
      - name: Package the .app, dmg and tar.gz
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name=="glowfly") | .version')"
          bash scripts/package-macos.sh aarch64-apple-darwin "v$version"
      - name: Check the licence files
        run: bash scripts/package-check-licences.sh dist/Glowfly.app dist/*.dmg dist/*.tar.gz
