[workspace]
resolver = "3"
members = ["crates/trellis-core", "crates/trellis-app"]
default-members = ["crates/trellis-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bg9m9r/trellis"

[workspace.dependencies]
chrono = { version = "0.4", features = ["unstable-locales"] }
# Networking goes through the git CLI, so libgit2 needs no SSH/HTTPS (and no OpenSSL).
git2 = { version = "0.20", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
trellis-core = { path = "crates/trellis-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
