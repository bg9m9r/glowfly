[workspace]
resolver = "3"
members = [
    "crates/glowfly-core",
    "crates/glowfly-model",
    "crates/glowfly-runner",
    "crates/glowfly-ui",
    "crates/glowfly-flows",
    "crates/glowfly-app",
]
default-members = ["crates/glowfly-app"]
# The fuzz targets are a workspace of their own (fuzz/Cargo.toml): they need nightly and libFuzzer.
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0-rc.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bg9m9r/glowfly"

[workspace.dependencies]
chrono = { version = "0.4", features = ["unstable-locales"] }
# Networking goes through the git CLI, so libgit2 needs no SSH/HTTPS (and no OpenSSL).
git2 = { version = "0.20", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
# Versions more than one manifest (or one manifest twice) names. Features stay with the crates
# that need them; these entries set only the version and whether default features are on.
eframe = "0.31"
egui-wgpu = { version = "0.31", default-features = false }
egui_kittest = "0.31"
dify = { version = "0.7", default-features = false }
image = { version = "0.25", default-features = false }
keyring = "3"
pulldown-cmark = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
syntect = { version = "5.3", default-features = false }
toml = "1.1"
tracing = "0.1.44"
two-face = { version = "0.5.2", default-features = false }
# Also what trash and tauri-winrt-notification build, so the tree has one copy on Windows.
windows = "0.62"
winit = { version = "0.30", default-features = false }
glowfly-core = { path = "crates/glowfly-core" }
glowfly-model = { path = "crates/glowfly-model" }
glowfly-runner = { path = "crates/glowfly-runner" }
glowfly-ui = { path = "crates/glowfly-ui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# Function length: the threshold is in clippy.toml.
[workspace.lints.clippy]
too_many_lines = "warn"

# Smaller, faster release builds. Panics still unwind: effect threads catch them.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Debug builds and tests: line tables are enough for panics and backtraces, and dependencies
# need none. Much less to write and link than full debug info. Dependencies (egui, wgpu, image,
# syntect, libgit2, ...) are lightly optimized so tests run faster; workspace crates stay at
# opt-level 0 so they rebuild quickly.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
