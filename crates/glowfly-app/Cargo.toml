[package]
name = "glowfly"
description = "Glowfly: a native Git client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "glowfly"
path = "src/main.rs"

[dependencies]
glowfly-core.workspace = true
glowfly-model.workspace = true
glowfly-runner.workspace = true
chrono.workspace = true
git2.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
# Reads the system's CJK fonts (src/platform/system_fonts.rs): ab_glyph is the parser egui
# draws them with, memmap2 maps them instead of reading them into memory.
ab_glyph = "0.2.32"
eframe = "0.31"
memmap2 = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }

# The drawn Windows frame's glue with the OS (src/platform/native_window/): Snap Layouts over the
# Maximize button, the system menu and the Mica backdrop.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

# Folders and links macOS hands Glowfly.app as Apple events (src/platform/macos_events.rs), and
# the system menu bar showing Glowfly's menus (src/platform/macos_menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSCell"] }
# Turns off winit's default app menu (src/platform/native_menu.rs).
winit = { version = "0.30", default-features = false }

# The Linux PRIMARY selection the terminal sets and middle-click pastes
# (src/platform/primary_selection.rs): the clipboard crates the window already links through
# egui-winit (smithay-clipboard on Wayland, arboard on X11), so nothing new is built.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false }
smithay-clipboard = "0.7"
raw-window-handle = "0.6"

[dev-dependencies]
# The shared fixture helpers (glowfly-core's src/testkit/): repositories built in-process.
glowfly-core = { workspace = true, features = ["testkit"] }
# The model's pure test helpers (glowfly-model's src/testing.rs).
glowfly-model = { workspace = true, features = ["test-support"] }
# The runner's test entry points (glowfly-runner's src/testing.rs).
glowfly-runner = { workspace = true, features = ["test-support"] }
egui_kittest = { version = "0.31", features = ["snapshot", "wgpu"] }
# One wgpu device for all view tests (ui/snapshot_check.rs); the version kittest renders with.
egui-wgpu = { version = "0.31", default-features = false }
# tests/app_icon.rs renders the app icon and checks the PNGs in assets/icon.
image = { version = "0.25", default-features = false, features = ["png"] }
# tests/linux_packages.rs reads the package metadata below.
toml = "1.1"

# The icon and version details of glowfly.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The Linux package (scripts/package-linux.sh runs `cargo deb -p glowfly --no-build`).
[package.metadata.deb]
name = "glowfly"
maintainer = "Glowfly contributors <https://github.com/bg9m9r/glowfly/issues>"
copyright = "Copyright 2026 Brett Gamerson and the Glowfly contributors"
section = "vcs"
priority = "optional"
# `$auto` lists only the libraries the program links. winit, glutin and the Wayland client load
# the windowing ones at run time (dlopen), so those are named here, for Debian 12 and Ubuntu
# 22.04 or newer: xkbcommon (the keyboard; its X11 part on X11), Xlib with its xcb bridge, the
# cursor and input extensions, xcb, the Wayland client and its EGL bridge, and the GL loaders
# (EGL first, GLX on X11). tests/linux_packages.rs keeps this list and the .rpm's in step.
depends = "$auto, git, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxcb1, libwayland-client0, libwayland-egl1, libegl1, libgl1"
extended-description = """Glowfly is a native Git client: a commit graph, diffs, staging by file, hunk or line, branches, stashes, rebases and pull requests from the hosting service."""
assets = [
    ["target/release/glowfly", "usr/bin/", "755"],
    ["../../packaging/linux/glowfly.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/glowfly-links.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon/glowfly-16.png", "usr/share/icons/hicolor/16x16/apps/glowfly.png", "644"],
    ["../../assets/icon/glowfly-24.png", "usr/share/icons/hicolor/24x24/apps/glowfly.png", "644"],
    ["../../assets/icon/glowfly-32.png", "usr/share/icons/hicolor/32x32/apps/glowfly.png", "644"],
    ["../../assets/icon/glowfly-48.png", "usr/share/icons/hicolor/48x48/apps/glowfly.png", "644"],
    ["../../assets/icon/glowfly-64.png", "usr/share/icons/hicolor/64x64/apps/glowfly.png", "644"],
    ["../../assets/icon/glowfly-128.png", "usr/share/icons/hicolor/128x128/apps/glowfly.png", "644"],
    ["../../assets/icon/glowfly-256.png", "usr/share/icons/hicolor/256x256/apps/glowfly.png", "644"],
    ["../../assets/icon/glowfly-512.png", "usr/share/icons/hicolor/512x512/apps/glowfly.png", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/glowfly/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/glowfly/", "644"],
    ["../../README.md", "usr/share/doc/glowfly/", "644"],
    ["../../THIRD-PARTY-NOTICES.md", "usr/share/doc/glowfly/", "644"],
    # Which package installed Glowfly (app_update::PACKAGE_FORMAT_FILE).
    ["../../packaging/linux/package-format.deb", "usr/share/glowfly/package-format", "644"],
]

# The .rpm (cargo-generate-rpm, scripts/package-linux.sh): the same files as the .deb. The
# version is set from the tag at packaging time. No asset is marked `doc`: systems set to skip
# documentation (Fedora's container images use dnf's tsflags=nodocs) would then leave the
# licenses out, and the install check expects every file (tests/linux_packages.rs).
[package.metadata.generate-rpm]
name = "glowfly"
summary = "A native Git client"
license = "MIT OR Apache-2.0"
url = "https://github.com/bg9m9r/glowfly"
assets = [
    { source = "target/release/glowfly", dest = "/usr/bin/glowfly", mode = "755" },
    { source = "../../packaging/linux/glowfly.desktop", dest = "/usr/share/applications/glowfly.desktop", mode = "644" },
    { source = "../../packaging/linux/glowfly-links.desktop", dest = "/usr/share/applications/glowfly-links.desktop", mode = "644" },
    { source = "../../assets/icon/glowfly-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/glowfly.png", mode = "644" },
    { source = "../../assets/icon/glowfly-24.png", dest = "/usr/share/icons/hicolor/24x24/apps/glowfly.png", mode = "644" },
    { source = "../../assets/icon/glowfly-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/glowfly.png", mode = "644" },
    { source = "../../assets/icon/glowfly-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/glowfly.png", mode = "644" },
    { source = "../../assets/icon/glowfly-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/glowfly.png", mode = "644" },
    { source = "../../assets/icon/glowfly-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/glowfly.png", mode = "644" },
    { source = "../../assets/icon/glowfly-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/glowfly.png", mode = "644" },
    { source = "../../assets/icon/glowfly-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/glowfly.png", mode = "644" },
    { source = "../../LICENSE-MIT", dest = "/usr/share/doc/glowfly/LICENSE-MIT", mode = "644" },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/doc/glowfly/LICENSE-APACHE", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/glowfly/README.md", mode = "644" },
    { source = "../../THIRD-PARTY-NOTICES.md", dest = "/usr/share/doc/glowfly/THIRD-PARTY-NOTICES.md", mode = "644" },
    { source = "../../packaging/linux/package-format.rpm", dest = "/usr/share/glowfly/package-format", mode = "644" },
]

# The libraries the program loads at run time, the same set as the .deb's `depends`. They are
# named by soname, the way rpm's own linked-library requirements are, so Fedora and openSUSE
# (whose package names differ) both resolve them.
[package.metadata.generate-rpm.requires]
git = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libxcb.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
