[package]
name = "trellis-core"
description = "Git, hosting-service and settings logic for Trellis (no UI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
git2.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
base64 = "0.23.1"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
sha2 = "0.11.1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
ureq = { version = "2", features = ["json"] }
thiserror = "2"
trash = "5.2"
portable-pty = "0.9"
vt100 = "0.15"

[build-dependencies]
syntect = { version = "5.3", default-features = false, features = ["parsing", "yaml-load", "dump-create", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

# Linux: save tokens in the desktop keyring (GNOME Keyring, KWallet) through the Secret Service.
[target."cfg(target_os = \"linux\")".dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
