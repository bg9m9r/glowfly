[package]
name = "glowfly-core"
description = "Git, hosting-service and settings logic for Glowfly (no UI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
doctest = false

[features]
# The fixture helpers in src/testkit/ for the other crates' tests (their dev-dependencies turn this on).
testkit = []
# The checks the fuzz targets in fuzz/ run (src/fuzzing/), and the crate-private parsers they
# reach. Only the fuzz crate turns this on.
fuzzing = []

[dependencies]
chrono.workspace = true
git2.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
# The version ureq 2 builds, so the tree has one copy.
base64 = "0.22.1"
# Commit messages and names in the encoding their `encoding` header names (commit_text.rs).
encoding_rs = "0.8"
icu_normalizer = "2.3"
# Hosts of links in descriptions shown in punycode (forge/link_hosts.rs); already in the tree.
idna = "1.1"
# SIMD byte search for the case-insensitive commit search (matching.rs); already in the tree.
memchr = "2.8"
# Inline parent and graph-edge lists for the loaded history (repo/commit_info.rs, graph.rs);
# already in the tree. `union` keeps the inline items and the heap pointer in the same bytes.
smallvec = { version = "1.15", features = ["union"] }
getrandom = "0.3"
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pulldown-cmark.workspace = true
keyring = { workspace = true, features = ["windows-native", "apple-native"] }
# The version keyring builds on Linux (dbus-secret-service), so the tree has one copy.
sha2 = "0.10.9"
syntect = { workspace = true, features = ["parsing", "dump-load", "regex-fancy"] }
ureq = { version = "2", features = ["json"] }
percent-encoding = "2.3"
same-file = "1"
thiserror = "2"
# Spans around the slow phases of a load and an index build (no subscriber here: the app installs it).
tracing.workspace = true
trash = "5.2"
portable-pty = "0.9"
vt100 = "0.16"
toml.workspace = true
# Reading a portable update's zip or tar.gz (app_update/archive.rs): decompression only, with
# flate2's pure-Rust inflate.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Checking a release's SHA256SUMS.minisig against the pinned keys (app_update/signature.rs):
# verification only, pure Rust, no dependencies.
minisign-verify = "0.3"
# SVG previews in the diff (preview_svg.rs): text set in the bundled fonts only (no system fonts),
# embedded raster images through decoders already in the tree.
resvg = { version = "0.49", default-features = false, features = ["text", "raster-images"] }

[build-dependencies]
syntect = { workspace = true, features = ["parsing", "yaml-load", "dump-create", "regex-fancy"] }
two-face = { workspace = true, features = ["syntect-fancy"] }

[dev-dependencies]
filetime = "0.2.29"
# A loopback port held bound but never listening, for "nothing listens there" tests
# (testutil::closed_port): std can only bind a TCP socket by listening on it. Also the forge
# tests' mock server: closing a finished connection without leaving it in TIME_WAIT.
socket2 = "0.6"
two-face = { workspace = true, features = ["syntect-fancy"] }
# Signing local update feeds with the committed test key in the updater's tests
# (app_update/signature_tests.rs): minisign's Ed25519 over BLAKE2b-512, without its CLI.
ed25519-compact = { version = "2.6", default-features = false }
blake2 = "0.10"

# Linux: save tokens in the desktop keyring (GNOME Keyring, KWallet) through the Secret Service.
[target."cfg(target_os = \"linux\")".dependencies]
pulldown-cmark.workspace = true
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Wdk_System_Threading"] }

# Linux: whether a repository is on a network or virtual file system (statfs). macOS: why the
# Trash refused a file, and whether a volume is on the network (the volume's flags). Both:
# starting git children in a new session for OpenSSH before 8.4 and for stoppable commands
# (setsid, ssh_version.rs, process_tree.rs), and signalling their process group.
[target."cfg(unix)".dependencies]
libc = "0.2"
