[package]
name = "glowfly-ui"
description = "Glowfly's views: egui drawing of the model's state, turning input into messages."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
doctest = false

[features]
# The view tests' helpers for the app crate's tests (src/snapshot_check/, src/snapshot_fixtures.rs,
# `palette_rect` and the bundled CJK subset in theme/fonts.rs); its dev-dependency turns this on.
# Only adds items, and never reaches a release build.
test-support = ["dep:egui_kittest", "dep:egui-wgpu", "dep:image", "dep:dify", "glowfly-core/testkit", "glowfly-model/test-support"]

[dependencies]
glowfly-core.workspace = true
glowfly-model.workspace = true
chrono.workspace = true
git2.workspace = true
serde_json.workspace = true
eframe.workspace = true
tracing.workspace = true
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"], optional = true }
# One wgpu device for all view tests (src/snapshot_check/); the version kittest renders with.
egui-wgpu = { workspace = true, optional = true }
image = { workspace = true, features = ["png"], optional = true }
# The image comparison kittest makes, so an update can leave an image within tolerance alone.
dify = { workspace = true, optional = true }

[dev-dependencies]
glowfly-core = { workspace = true, features = ["testkit"] }
glowfly-model = { workspace = true, features = ["test-support"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
egui-wgpu.workspace = true
image = { workspace = true, features = ["png"] }
dify.workspace = true
