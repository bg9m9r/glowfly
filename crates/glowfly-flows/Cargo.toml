[package]
name = "glowfly-flows"
description = "Glowfly's end-to-end update tests, run through the runner (tests only)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
doctest = false

# Everything is test code (src/lib.rs has only cfg(test) items), so every dependency is a
# dev-dependency.
[dev-dependencies]
glowfly-core = { workspace = true, features = ["testkit"] }
glowfly-model = { workspace = true, features = ["test-support"] }
glowfly-runner = { workspace = true, features = ["test-support"] }
chrono.workspace = true
git2.workspace = true
serde_json.workspace = true
# history_preview_tests.rs writes PNGs for the image preview.
image = { version = "0.25", default-features = false, features = ["png"] }
